site_name: Molecular Programmer Knowledge Base
site_description: Molecular programming news, fundamentals, tutorials, and more
site_url: https://docs.molecularprogrammer.org
repo_url: https://github.com/molecularprogrammer/knowledge-base
repo_name: molecularprogrammer/knowledge-base
docs_dir: docs/
site_dir: site/

theme:
    logo: images/logo.ico
    favicon: images/logo.ico
    name: material
    palette:
        -   scheme:     slate
    features:
        -   navigation.tracking
        -   navigation.instant
        -   navigation.index

docs_dir: docs/
site_dir: site/
use_directory_urls: false

theme:
    name: materialx
    palette:
        -   scheme:     slate
    features:
        -   navigation.tracking
        -   navigation.instant
        -   navigation.index

extra_css:
    -   resources/stylesheets/extra.css

plugins:
    - awesome-pages
    - minify
    - tags

markdown_extensions:
    - admonition
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - extensions.ditaa
    - pymdownx.superfences:
        custom_fences:
          - name: ditaa
            class: ditaa
            format: !!python/name:extensions.ditaa.ditaa_fence
    - admonition
    - pymdownx.details
    - attr_list
    - tables
    - plantuml_markdown:
        plantuml_cmd: "java -Djava.awt.headless=true -jar /opt/plantuml/plantuml.jar"
